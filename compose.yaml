name: pc-workshop

services:
  backend:
    build:
      context: ./backend
    image: pc-workshop-backend:latest
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LLAMA_URL: ${LLAMA_URL:-http://host.docker.internal:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: pc-workshop-frontend:latest
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    environment:
      BACKEND_UPSTREAM: http://backend:8080
    depends_on:
      - backend
    restart: unless-stopped
