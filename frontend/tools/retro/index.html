<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Retro lab</title>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&display=swap" />
    <style>
      html, body { margin: 0; color: #ccc; font: 13px system-ui;
        background: #09090b radial-gradient(circle, #1b1b20 1px, transparent 1.2px) 0 0 / 22px 22px; }
      #out { display: block; max-width: 100%; max-height: 100vh; margin: 0 auto; }
      #bar { position: fixed; top: 8px; right: 8px; display: flex; gap: 6px; }
      #bar button { font: inherit; padding: 6px 10px; }
    </style>
  </head>
  <body>
    <div id="bar">
      <button data-state="0">up</button>
      <button data-state="1">hover</button>
      <button data-state="2">pressed</button>
      <button id="save">save</button>
    </div>
    <canvas id="out"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
